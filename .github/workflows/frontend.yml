name: Frontend CI/CD + Preview

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------
  # 1) PR 미리보기 (GitHub Pages 사용)
  # ---------------------------------
  preview:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write

    env:
      REACT_APP_API_BASE_URL:               ${{ secrets.REACT_APP_API_BASE_URL }}
      REACT_APP_EMAILJS_PUBLIC_KEY:         ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
      REACT_APP_EMAILJS_SERVICE_ID:         ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
      REACT_APP_EMAILJS_TEMPLATE_ID:        ${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID }}
      REACT_APP_EMAILJS_TEMPLATE_ID_LOW_CAPITAL: ${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID_LOW_CAPITAL }}
      REACT_APP_HOTEL_BASE_URL:             ${{ secrets.REACT_APP_HOTEL_BASE_URL }}
      REACT_APP_IMAGE_BASE_URL:             ${{ secrets.REACT_APP_IMAGE_BASE_URL }}
      REACT_APP_NAVER_MAP_CLIENT_ID:        ${{ secrets.REACT_APP_NAVER_MAP_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --no-audit --progress=false || npm i --no-audit --progress=false

      - name: Create .env (for preview)
        run: |
          {
            echo "REACT_APP_API_BASE_URL=$REACT_APP_API_BASE_URL"
            echo "REACT_APP_EMAILJS_PUBLIC_KEY=$REACT_APP_EMAILJS_PUBLIC_KEY"
            echo "REACT_APP_EMAILJS_SERVICE_ID=$REACT_APP_EMAILJS_SERVICE_ID"
            echo "REACT_APP_EMAILJS_TEMPLATE_ID=$REACT_APP_EMAILJS_TEMPLATE_ID"
            echo "REACT_APP_EMAILJS_TEMPLATE_ID_LOW_CAPITAL=$REACT_APP_EMAILJS_TEMPLATE_ID_LOW_CAPITAL"
            echo "REACT_APP_HOTEL_BASE_URL=$REACT_APP_HOTEL_BASE_URL"
            echo "REACT_APP_IMAGE_BASE_URL=$REACT_APP_IMAGE_BASE_URL"
            echo "REACT_APP_NAVER_MAP_CLIENT_ID=$REACT_APP_NAVER_MAP_CLIENT_ID"
          } >> .env

      - name: Build preview
        env:
          NODE_ENV: production
          PREVIEW: 'true'
          PR_NUMBER: ${{ github.event.number }}
        run: npm run build

      - name: SPA 404 fallback
        run: cp build/index.html build/404.html || true

      - name: Add .nojekyll
        run: echo > build/.nojekyll

      - name: Publish to gh-pages/pr-<num>
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build
          destination_dir: pr-${{ github.event.number }}
          keep_files: true

      - name: Start deployment
        id: deploy
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: preview/pr-${{ github.event.number }}
          ref: ${{ github.head_ref || github.ref }}
          transient: true
          auto_inactive: true

      - name: Debug deployment id
        run: echo "deployment_id=${{ steps.deploy.outputs.deployment_id }}"

      - name: Finish deployment (success)
        if: ${{ success() && steps.deploy.outputs.deployment_id != '' }}
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.deploy.outputs.deployment_id }}
          env: preview/pr-${{ github.event.number }}
          status: success
          env_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/

      - name: Finish deployment (failure)
        if: ${{ failure() && steps.deploy.outputs.deployment_id != '' }}
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.deploy.outputs.deployment_id }}
          env: preview/pr-${{ github.event.number }}
          status: failure

      - name: Comment preview URL
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/`
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔍 **Preview ready:** [${url}](${url})`
            })

  # ---------------------------------
  # 2) prod push: 빌드 → 아티팩트 업로드
  # ---------------------------------
  package:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    name: Package – Build artifact (prod)
    runs-on: ubuntu-latest

    env:
      REACT_APP_API_BASE_URL:               ${{ secrets.REACT_APP_API_BASE_URL }}
      REACT_APP_EMAILJS_PUBLIC_KEY:         ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
      REACT_APP_EMAILJS_SERVICE_ID:         ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
      REACT_APP_EMAILJS_TEMPLATE_ID:        ${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID }}
      REACT_APP_EMAILJS_TEMPLATE_ID_LOW_CAPITAL: ${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID_LOW_CAPITAL }}
      REACT_APP_HOTEL_BASE_URL:             ${{ secrets.REACT_APP_HOTEL_BASE_URL }}
      REACT_APP_IMAGE_BASE_URL:             ${{ secrets.REACT_APP_IMAGE_BASE_URL }}
      REACT_APP_NAVER_MAP_CLIENT_ID:        ${{ secrets.REACT_APP_NAVER_MAP_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --no-audit --progress=false || npm i --no-audit --progress=false

      - name: Create .env (prod)
        run: |
          {
            echo "REACT_APP_API_BASE_URL=$REACT_APP_API_BASE_URL"
            echo "REACT_APP_EMAILJS_PUBLIC_KEY=$REACT_APP_EMAILJS_PUBLIC_KEY"
            echo "REACT_APP_EMAILJS_SERVICE_ID=$REACT_APP_EMAILJS_SERVICE_ID"
            echo "REACT_APP_EMAILJS_TEMPLATE_ID=$REACT_APP_EMAILJS_TEMPLATE_ID"
            echo "REACT_APP_EMAILJS_TEMPLATE_ID_LOW_CAPITAL=$REACT_APP_EMAILJS_TEMPLATE_ID_LOW_CAPITAL"
            echo "REACT_APP_HOTEL_BASE_URL=$REACT_APP_HOTEL_BASE_URL"
            echo "REACT_APP_IMAGE_BASE_URL=$REACT_APP_IMAGE_BASE_URL"
            echo "REACT_APP_NAVER_MAP_CLIENT_ID=$REACT_APP_NAVER_MAP_CLIENT_ID"
          } >> .env

      - name: Build (prod artifact)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------
  # 3) prod push: 서버 배포 (from artifact)
  # ---------------------------------
  deploy:
    needs: package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    name: CD – Deploy from artifact
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build

      # [추가됨] 1. 파일 전송 속도를 위해 압축 (수천 개의 파일을 1개로 만듦)
      - name: Tar build files
        run: tar -czf build.tar.gz -C build .

      # [수정됨] 2. 압축된 파일 1개만 서버로 전송 (매우 빠름)
      # /tmp 디렉토리나 사용자 홈 디렉토리로 먼저 보냅니다.
      - name: Transfer compressed file to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "build.tar.gz"
          target: "/home/${{ secrets.SERVER_USERNAME }}/" # 홈 디렉토리로 전송

      # [수정됨] 3. 서버에서 압축 해제 및 '치기(Swap)' 방식으로 무중단 배포
      - name: Extract and Swap (Zero Downtime)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # 에러 발생 시 스크립트 중단
            set -e

            # 변수 설정
            TAR_FILE="/home/${{ secrets.SERVER_USERNAME }}/build.tar.gz"
            DEPLOY_DIR="/var/www/html"
            NEW_DIR="/var/www/html_new"
            BACKUP_DIR="/var/www/html_old"

            echo "🚀 배포 시작..."

            # 1. 새 배포를 위한 임시 디렉토리 생성 (기존에 있다면 삭제 후 생성)
            rm -rf $NEW_DIR
            mkdir -p $NEW_DIR

            # 2. 압축 해제 (임시 디렉토리에)
            echo "📦 압축 해제 중..."
            tar -xzf $TAR_FILE -C $NEW_DIR

            # 3. 폴더 스위칭 (순식간에 교체됨 - 무중단)
            # 기존 html 폴더가 있다면 _old로 백업하고, 새 폴더를 html로 변경
            echo "🔄 서비스 교체 중..."
            
            # (옵션) 기존 폴더가 있는지 확인
            if [ -d "$DEPLOY_DIR" ]; then
              # 기존 폴더를 백업 이름으로 변경 (잠시 보관)
              # 백업 폴더가 이미 있다면 삭제
              rm -rf $BACKUP_DIR
              mv $DEPLOY_DIR $BACKUP_DIR
            fi

            # 새 폴더를 정식 폴더명으로 변경
            mv $NEW_DIR $DEPLOY_DIR

            # 4. 정리 작업
            echo "🧹 정리 중..."
            rm -f $TAR_FILE
            # (선택사항) 백업 폴더 삭제. 바로 지우거나 나중에 지워도 됨.
            rm -rf $BACKUP_DIR 

            echo "✅ 배포 완료!"
