      //디비 여러개시 아이디값 별도 추가입력
      $('#input3').on('keyup', function () {
        if (this.value.length == 4) {

        }
      });
      $('#input4').on('keyup', function () {
        if (this.value.length == 4) {
          $(this).blur();
        }
      });
      $(function () {
        var isComposing = false;
        $('.kr')
          // 조합 시작 플래그
          .on('compositionstart', function () {
            isComposing = true;
          })
          // 조합 종료 후 한 번 필터링
          .on('compositionend', function () {
            isComposing = false;
            filterAndAlert(this);
          })
          // 일반 입력(붙여넣기, 백스페이스 포함)
          .on('input', function () {
            if (!isComposing) {
              filterAndAlert(this);
            }
          });
        function filterAndAlert(el) {
          var v = el.value;
          // 유니코드 Hangul Jamo, Compatibility Jamo, Syllables 영역만 허용
          var filtered = v.replace(/[^\u1100-\u11FF\u3131-\u318E\uAC00-\uD7A3]+/g, '');
          if (v !== filtered) {
            alert('한글만 입력 가능합니다.');
            el.value = filtered;
          }
        }
      });
      $(function () {
        $('.num').keyup(function (event) {
          regexp = /[^0-9]/gi;
          v = $(this).val();
          if (regexp.test(v)) {
            alert('숫자만 입력가능 합니다.');
            $(this).val(v.replace(regexp, ''));
          }
        });
      });
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const limitEls = document.querySelectorAll('.limit');
        const minLimit = 2;
        limitEls.forEach(function (limitEl) {
          let current = parseInt(limitEl.textContent.trim(), 10);
          const timer = setInterval(function () {
            if (current > minLimit) {
              current--;
              limitEl.textContent = current;
            } else {
              clearInterval(timer);
            }
          }, 13000);
        });
      });
    </script>
